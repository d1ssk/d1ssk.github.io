<!doctype html>
<!-- Generated index.html comes from this template and each work's info.json. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Photography and art by Daichi Sasaki.">
    <title>Daichi Sasaki — Photography &amp; More</title>
    <link rel="stylesheet" href="styles.css">
    <script src="layout.js" defer></script>
    <script src="information.js" defer></script>
    <script src="gallery.js" defer></script>
  </head>
  <body>
    <header class="site-header container">
      <span class="site-name">Daichi Sasaki</span>
      <nav aria-label="Main navigation">
        <a href="https://d1ssk.github.io/">Home <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main class="container">
      <div class="intro">
        <h1>Photography &amp; More</h1>
      </div>
      <section class="gallery" aria-label="Photography and art">
<!-- GALLERY -->
      </section>
    </main>

    <footer class="site-footer container">
      <p>© 2026 Daichi Sasaki</p>
    </footer>

    <dialog class="viewer" id="viewer" aria-label="Enlarged image">
      <div class="viewer-shell">
        <header class="viewer-toolbar">
          <div class="viewer-actions">
            <span class="viewer-count" id="viewer-count" aria-live="polite" aria-atomic="true"></span>
            <button class="viewer-button" id="viewer-close" type="button" aria-label="Close enlarged image" autofocus>
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="m6 6 12 12M6 18 18 6"/>
              </svg>
            </button>
          </div>
        </header>
        <div class="viewer-stage" id="viewer-stage">
          <button class="viewer-button viewer-nav" id="viewer-previous" type="button" aria-label="Previous work">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="m14 5-7 7 7 7"/>
            </svg>
          </button>
          <figure class="viewer-work" id="viewer-work">
            <div class="viewer-image-wrap">
              <img id="viewer-image" alt="" decoding="async">
            </div>
            <figcaption class="viewer-info" id="viewer-info" hidden>
              <h2 id="viewer-title" hidden></h2>
              <p id="viewer-description" hidden></p>
              <dl class="viewer-details" id="viewer-details"></dl>
            </figcaption>
          </figure>
          <button class="viewer-button viewer-nav" id="viewer-next" type="button" aria-label="Next work">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="m10 5 7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </dialog>
  </body>
</html>
